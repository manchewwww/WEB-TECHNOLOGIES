openapi: 3.0.0
info:
  title: Simple Express API
  version: 1.0.0
  description: A simple API example with Express and Swagger
servers:
  - url: http://localhost:3000
paths:
  /api/hello:
    get:
      summary: Returns a greeting
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
